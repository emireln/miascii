<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>miascii — text · image · video → ascii</title>
    <meta name="description" content="Convert text, images, and video into ASCII art. Retro CRT terminal vibes." />
    <meta name="theme-color" content="#0a0a0a" />
    <!-- Apply the saved theme before first paint so the page never flashes the wrong palette. -->
    <script>
      (function () {
        var ids = ['default-dark', 'default-light', 'phosphor', 'amber', 'synthwave', 'cyan', 'alert', 'paper'];
        var t = null;
        try { t = JSON.parse(localStorage.getItem('miascii:shell.theme')); } catch (e) {}
        if (t === 'dark') t = 'default-dark';
        if (t === 'light') t = 'default-light';
        document.documentElement.dataset.theme = ids.indexOf(t) >= 0 ? t : 'default-dark';
      })();
    </script>
    <!-- Favicons (pixel-cat mascot) -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
